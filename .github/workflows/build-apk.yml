name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' ! -name 'www' ! -name '.moon-icons' ! -name 'node_modules' -exec cp -r {} www/ \;

      - name: Init npm project
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Init Capacitor
        run: |
          npx cap init "moneyledger" "com.moondevelopers.moneyledger" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icon
        run: |
          for d in .moon-icons/mipmap-*; do
            n=$(basename "$d")
            mkdir -p "android/app/src/main/res/$n"
            cp "$d"/*.png "android/app/src/main/res/$n/"
          done

      - name: Sync web assets
        run: npx cap sync android

      - name: Fix duplicate Kotlin stdlib classes
        run: |
          echo 'configurations.all {' >> android/app/build.gradle
          echo '    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"' >> android/app/build.gradle
          echo '    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"' >> android/app/build.gradle
          echo '}' >> android/app/build.gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
